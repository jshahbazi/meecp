[package]
name = "meecp-uzu-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
hanashi = { git = "https://github.com/trymirai/uzu.git", rev = "8d01581474760bd1fc7f4a547ff1d02f7dada437", default-features = false }
shoji = { git = "https://github.com/trymirai/uzu.git", rev = "8d01581474760bd1fc7f4a547ff1d02f7dada437", default-features = false }
uzu-engine = { git = "https://github.com/trymirai/uzu.git", rev = "8d01581474760bd1fc7f4a547ff1d02f7dada437", default-features = false, features = ["metal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
sha2 = "0.10"

# Prepared from the exact revision above and the tracked next-token patch by
# build_scoring.py. Build output/source live in ignored runtime/ directories.
[patch."https://github.com/trymirai/uzu.git"]
uzu-engine = { path = "../../runtime/uzu-rust/upstream/crates/uzu-engine" }
hanashi = { path = "../../runtime/uzu-rust/upstream/crates/legacy/hanashi" }
shoji = { path = "../../runtime/uzu-rust/upstream/crates/legacy/shoji" }

[profile.release]
lto = "thin"

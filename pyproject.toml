[project]
name = "jevk5-menubar"
version = "0.1.0"
description = "Local JevK5 decision model and MCP service for a macOS menu bar app"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.26,<2", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "jsonschema>=4.20,<5", "pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "vendor"]
asyncio_mode = "auto"

[tool.uv]
package = false
